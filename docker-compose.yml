# Fyndue on a shared server (docs/deployment.md).
#   docker compose up -d --build
# The web app is published only on 127.0.0.1. HTTPS comes either from the
# server's existing nginx / Caddy (shared server, the default) or, on a
# server of its own, from the bundled Caddy (COMPOSE_PROFILES=proxy).
name: fyndue

x-app-env: &app-env
  # `fyndue-db`, not `db`: when `web` also joins another project's network
  # (deploy/docker-compose.shared-caddy.yml), a plain `db` could resolve to
  # that project's database.
  DATABASE_URL: postgresql://fyndue:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@fyndue-db:5432/fyndue
  BETTER_AUTH_URL: ${APP_URL:?set APP_URL in .env}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
  STORAGE_DIR: /app/storage

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fyndue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fyndue
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      default:
        aliases: [fyndue-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fyndue -d fyndue"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies pending migrations, then exits. `web` starts only if it succeeded.
  migrate:
    build: .
    image: fyndue-app
    pull_policy: build
    command: ["prisma", "migrate", "deploy"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: fyndue-app
    # Built locally by `migrate`; never looked up on Docker Hub.
    pull_policy: never
    restart: unless-stopped
    environment: *app-env
    ports:
      - "127.0.0.1:${FYNDUE_PORT:-3100}:3000"
    volumes:
      - documents:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Every 15 minutes: payment reminders (docs/telegram.md §4) and today's
  # Central Bank of Uzbekistan exchange rates (a no-op once stored).
  scheduler:
    image: alpine:3.22
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command:
      - sh
      - -c
      - |
        while true; do
          sleep 900
          wget -q -O - --header "Authorization: Bearer $$CRON_SECRET" http://web:3000/api/cron/exchange-rates || echo "rate refresh failed"
          echo
          wget -q -O - --header "Authorization: Bearer $$CRON_SECRET" http://web:3000/api/cron/notifications || echo "reminder run failed"
          echo
        done
    depends_on:
      web:
        condition: service_healthy

  # HTTPS on ports 80/443, ONLY for a server that runs nothing else there.
  # Off unless COMPOSE_PROFILES=proxy; a server shared with other sites
  # keeps it off and uses its existing nginx/Caddy.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-fyndue.uz}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  db-data:
  documents:
  caddy-data:
  caddy-config:
