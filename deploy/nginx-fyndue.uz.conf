# /etc/nginx/sites-available/fyndue.uz  (docs/deployment.md, step 5)
# Forwards fyndue.uz to the Fyndue container on 127.0.0.1:3100.
# Certbot adds the HTTPS (443) part: sudo certbot --nginx -d fyndue.uz -d www.fyndue.uz

server {
    listen 80;
    listen [::]:80;
    server_name www.fyndue.uz;
    return 301 https://fyndue.uz$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name fyndue.uz;

    # Document uploads are up to 10 MB (nginx's default is 1 MB).
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
